<!doctype html>
<!--══════════════════════════════════════════════════════════════════════════════════════════════
    File:   index.html                                                                    Ver. 1.10
    Owner:  AF
    Desc.:  Q9 Browser-Frontend: xterm.js-Konsole + Worker-Loader. Der eigentliche Kernel läuft
            seit Phase 3.6 in web/worker.js (OPFS-Blockgerät braucht einen Worker); dieser
            Haupt-Thread bedient nur noch xterm.js + Image-Upload/-Download.
    Edition History
    26-07-02 1.00 Initiale Version                                                            CF
    26-07-03 1.01 UTF-8-Stream-Decoder; Input-getriebenes Stepping + rAF (Timer-Drosselung)  CF
    26-07-04 1.10 3.6: Kernel in Worker verlagert (OPFS/FileSystemSyncAccessHandle), Toolbar  CF
             mit Image-Upload/-Download (ungetestet, emsdk fehlt lokal)
    ═════════════════════════════════════════════════════════════════════════════════════════════-->
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Q9</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; background: #101014; }
    #toolbar   { display: flex; gap: 8px; align-items: center; padding: 6px 8px;
                 background: #1a1a20; border-bottom: 1px solid #2a2a32; font: 12px sans-serif; }
    #toolbar button { background: #2a2a32; color: #c8e6c9; border: 1px solid #3a3a44;
                       border-radius: 3px; padding: 3px 8px; cursor: pointer; }
    #toolbar button:hover { background: #3a3a44; }
    #toolbar span    { color: #888; }
    #wrap      { height: calc(100% - 34px); }
    #term      { height: 100%; padding: 8px; box-sizing: border-box; }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="btnLoad">Image laden…</button>
    <input id="fileLoad" type="file" accept=".img,.bin" style="display:none">
    <button id="btnSave">Image speichern…</button>
    <span id="status">q9disk.img (OPFS)</span>
  </div>
  <div id="wrap"><div id="term"></div></div>
  <script>
    const term = new Terminal({
      cursorBlink: true,
      fontSize: 16,
      theme: { background: '#101014', foreground: '#c8e6c9', cursor: '#8bc34a' }
    });
    term.open(document.getElementById('term'));
    term.focus();

    // Kernel + Konsole + Block-Device laufen im Worker (Pflicht für OPFS-SyncAccessHandle).
    const worker = new Worker('worker.js');

    // Tastendrücke gehen 1:1 an den Worker, der sie in seine eigene Input-Queue legt.
    term.onData(data => {
      for (const ch of data) worker.postMessage({ type: 'input', code: ch.charCodeAt(0) });
    });

    worker.onmessage = (ev) => {
      const msg = ev.data;
      if (msg.type === 'out') {
        term.write(msg.text);
      } else if (msg.type === 'image-loaded') {
        setStatus(`Image geladen (${msg.size} Bytes)`);
      } else if (msg.type === 'image-data') {
        const blob = new Blob([msg.data], { type: 'application/octet-stream' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'q9disk.img';
        a.click();
        URL.revokeObjectURL(a.href);
        setStatus('Image gespeichert');
      }
    };

    function setStatus(text) { document.getElementById('status').textContent = text; }

    // Upload: Datei einlesen, als transferables ArrayBuffer an den Worker schicken.
    const fileLoad = document.getElementById('fileLoad');
    document.getElementById('btnLoad').onclick = () => fileLoad.click();
    fileLoad.onchange = async () => {
      const file = fileLoad.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      worker.postMessage({ type: 'load-image', data: buf }, [buf]);
      fileLoad.value = '';
    };

    // Download: Worker liest das aktuelle OPFS-Image und schickt es zurück.
    document.getElementById('btnSave').onclick = () => {
      worker.postMessage({ type: 'get-image' });
    };
  </script>
</body>
</html>
