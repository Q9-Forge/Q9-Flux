# qemu-mapping.conf -- ordnet unsere eigenen Geraete-/Maschinen-Dateien
# ihrem Zielpfad im QEMU-Quellbaum (third_party/qemu/) zu.
#
# Format: eine Zeile pro Datei, "<Quelle relativ zu Q9-Flux-68kQEMU> <Ziel
# relativ zu third_party/qemu>", durch Leerzeichen getrennt. Leerzeilen
# und Zeilen mit "#" werden ignoriert.
#
# Unsere Quelle ist bewusst QEMU-unabhaengig benannt/strukturiert
# (devices/<geraet>/..., orientiert an Q9-Flux-68k/src/devices/<geraet>/)
# -- nur diese Datei kennt, wo QEMU die jeweilige Datei erwartet. Falls
# Q9-Flux irgendwann einen zweiten Emulator-Backend bekommt, kann fuer
# den eine eigene Mapping-Datei entstehen, ohne devices/ selbst
# anzufassen.

devices/rtc72421/q9_rtc72421.c   hw/rtc/q9_rtc72421.c
overlay/machine/q9board.c        hw/m68k/q9board.c
