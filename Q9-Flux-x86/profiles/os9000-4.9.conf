# Proven i386 PC baseline for the OS-9000 U4.9 XiBase image.
# Paths are relative to this profile's directory.
machine=pc
memory=64
image=../images/flux-x86.img
image_format=raw
# U4.9 supplies the matching spne2000/spne0 driver pair.  PCnet has no
# matching U4.9 module in the local distribution.
nic_model=ne2k_pci
network=user
display=default
snapshot=yes
